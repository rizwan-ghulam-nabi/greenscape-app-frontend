<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E7D32"/>
      <stop offset="100%" stop-color="#1B5E20"/>
    </linearGradient>

    <linearGradient id="leaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8BC34A"/>
      <stop offset="100%" stop-color="#4CAF50"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect
    x="16"
    y="16"
    width="480"
    height="480"
    rx="110"
    fill="url(#bg)"
  />

  <!-- G -->
  <g filter="url(#shadow)">
    <path
      d="M360 150
         C330 120 292 105 245 105
         C165 105 105 165 105 255
         C105 345 170 407 255 407
         C322 407 375 370 395 310
         L310 310
         L310 250
         L430 250
         L430 285
         C420 390 345 455 248 455
         C134 455 58 378 58 255
         C58 132 136 57 248 57
         C304 57 352 75 389 110
         Z"
      fill="white"
    />
  </g>

  <!-- Large Leaf -->
  <path
    d="M120 275
       C118 200 180 155 235 170
       C230 240 185 300 125 325
       C115 315 116 295 120 275Z"
    fill="url(#leaf)"
  />

  <!-- Leaf vein -->
  <path
    d="M132 310
       C160 270 183 230 210 182"
    stroke="#2E7D32"
    stroke-width="6"
    fill="none"
    stroke-linecap="round"
  />

  <!-- Small Leaf -->
  <path
    d="M190 335
       C192 290 225 265 262 275
       C255 315 228 350 190 360
       C185 352 186 343 190 335Z"
    fill="url(#leaf)"
  />

  <!-- Small vein -->
  <path
    d="M198 345
       C218 325 232 302 248 280"
    stroke="#2E7D32"
    stroke-width="5"
    fill="none"
    stroke-linecap="round"
  />
</svg>